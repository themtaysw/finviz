x-app: &app
  build: .
  environment:
    ConnectionStrings__Taxonomy: Host=db;Port=5432;Database=taxonomy;Username=taxonomy;Password=taxonomy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taxonomy
      POSTGRES_USER: taxonomy
      POSTGRES_PASSWORD: taxonomy
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxonomy -d taxonomy"]
      interval: 2s
      timeout: 3s
      retries: 15

  ingest:
    <<: *app
    command: ["dotnet", "/app/ingest/taxonomy-ingest.dll", "load", "/app/data/structure_released.xml"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      ingest:
        condition: service_completed_successfully

volumes:
  db-data:
